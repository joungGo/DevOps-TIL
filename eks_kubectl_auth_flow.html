<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EKS kubectl 인증 흐름</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8f8f6;
      color: #1a1a18;
      padding: 32px 20px;
      line-height: 1.6;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #6b6b66; margin-bottom: 24px; }

    svg { display: block; width: 100%; margin-bottom: 12px; cursor: default; }

    .tip-box {
      padding: 12px 16px;
      background: #f1efe8;
      border: 1px solid #d3d1c7;
      border-radius: 8px;
      font-size: 12px;
      color: #5f5e5a;
      line-height: 1.75;
      min-height: 60px;
      transition: all .2s;
    }
    .tip-box strong { color: #1a1a18; font-weight: 600; }
    .mono {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      background: #fff;
      border: 1px solid #d3d1c7;
      border-radius: 4px;
      padding: 1px 6px;
    }
    .hint {
      font-size: 12px;
      color: #888780;
      margin-bottom: 10px;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1c; color: #d4d2c8; }
      h1 { color: #d4d2c8; }
      .subtitle { color: #888780; }
      .tip-box { background: #2c2c2a; border-color: #444441; color: #888780; }
      .tip-box strong { color: #d4d2c8; }
      .mono { background: #1e1e1c; border-color: #444441; color: #85b7eb; }
      .hint { color: #5f5e5a; }
    }
  </style>
</head>
<body>
  <h1>EKS kubectl 인증 흐름</h1>
  <p class="subtitle">kubectl 실행 → aws eks get-token → STS 토큰 발급 → Bearer 토큰으로 EKS 인증</p>
  <p class="hint">각 박스를 클릭하면 상세 설명이 아래에 표시됩니다.</p>

  <svg viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" id="authsvg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <!-- 로컬 PC 컨테이너 -->
    <rect x="20" y="14" width="380" height="580" rx="14" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5" fill-opacity="0.6"/>
    <text font-family="inherit" font-size="13" font-weight="500" fill="#2C2C2A" x="42" y="38" dominant-baseline="central">로컬 PC</text>

    <!-- ① kubectl -->
    <g id="s1" onclick="showTip(0)" style="cursor:pointer">
      <rect x="40" y="54" width="340" height="72" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
      <text font-family="inherit" font-size="13" font-weight="500" fill="#0C447C" x="210" y="76" text-anchor="middle" dominant-baseline="central">① kubectl get pods</text>
      <text font-family="inherit" font-size="12" fill="#185FA5" x="210" y="97" text-anchor="middle" dominant-baseline="central">사용자가 명령 실행 — kubeconfig 파일 읽기 시작</text>
    </g>

    <!-- arrow: kubectl → kubeconfig -->
    <line x1="210" y1="126" x2="210" y2="144" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- kubeconfig -->
    <rect x="40" y="144" width="340" height="62" rx="8" fill="#D3D1C7" stroke="#888780" stroke-width="0.5" fill-opacity="0.5"/>
    <text font-family="inherit" font-size="13" font-weight="500" fill="#2C2C2A" x="210" y="163" text-anchor="middle" dominant-baseline="central">~/.kube/config</text>
    <text font-family="inherit" font-size="11" fill="#5F5E5A" x="210" y="183" text-anchor="middle" dominant-baseline="central">users[].exec: aws eks get-token --cluster-name url-shortener</text>

    <!-- arrow: kubeconfig → exec -->
    <line x1="210" y1="206" x2="210" y2="226" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text font-family="inherit" font-size="11" fill="#888780" x="222" y="218" dominant-baseline="central">exec 자동 실행</text>

    <!-- ② aws eks get-token -->
    <g id="s2" onclick="showTip(1)" style="cursor:pointer">
      <rect x="40" y="226" width="340" height="72" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
      <text font-family="inherit" font-size="13" font-weight="500" fill="#27500A" x="210" y="248" text-anchor="middle" dominant-baseline="central">② aws eks get-token</text>
      <text font-family="inherit" font-size="12" fill="#3B6D11" x="210" y="268" text-anchor="middle" dominant-baseline="central">kubectl이 자동 호출 — IAM 자격증명으로 STS 요청 생성</text>
    </g>

    <!-- arrow: get-token → STS -->
    <line x1="380" y1="262" x2="460" y2="262" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text font-family="inherit" font-size="11" fill="#888780" x="418" y="252" text-anchor="middle" dominant-baseline="central">STS 요청</text>

    <!-- AWS 영역 -->
    <rect x="460" y="100" width="200" height="200" rx="14" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5" fill-opacity="0.4"/>
    <text font-family="inherit" font-size="13" font-weight="500" fill="#633806" x="560" y="124" text-anchor="middle" dominant-baseline="central">AWS</text>

    <!-- ③ STS -->
    <g id="s3" onclick="showTip(2)" style="cursor:pointer">
      <rect x="476" y="138" width="168" height="72" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
      <text font-family="inherit" font-size="13" font-weight="500" fill="#633806" x="560" y="160" text-anchor="middle" dominant-baseline="central">③ AWS STS</text>
      <text font-family="inherit" font-size="12" fill="#854F0B" x="560" y="178" text-anchor="middle" dominant-baseline="central">Presigned URL 기반</text>
      <text font-family="inherit" font-size="12" fill="#854F0B" x="560" y="194" text-anchor="middle" dominant-baseline="central">임시 토큰 발급 (유효 15분)</text>
    </g>

    <!-- arrow: STS → 토큰 반환 -->
    <line x1="460" y1="310" x2="380" y2="340" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text font-family="inherit" font-size="11" fill="#888780" x="390" y="318" text-anchor="end" dominant-baseline="central">토큰 반환</text>

    <!-- ④ Bearer Token -->
    <g id="s4" onclick="showTip(3)" style="cursor:pointer">
      <rect x="40" y="340" width="340" height="72" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
      <text font-family="inherit" font-size="13" font-weight="500" fill="#3C3489" x="210" y="362" text-anchor="middle" dominant-baseline="central">④ Authorization: Bearer &lt;token&gt;</text>
      <text font-family="inherit" font-size="12" fill="#534AB7" x="210" y="382" text-anchor="middle" dominant-baseline="central">HTTP 헤더에 토큰 삽입 — EKS API Server로 전송</text>
    </g>

    <!-- arrow: bearer → API Server -->
    <line x1="380" y1="376" x2="460" y2="376" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- EKS API Server 영역 -->
    <rect x="460" y="340" width="200" height="130" rx="14" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5" fill-opacity="0.4"/>
    <text font-family="inherit" font-size="13" font-weight="500" fill="#712B13" x="560" y="362" text-anchor="middle" dominant-baseline="central">EKS API Server</text>

    <!-- ⑤ 토큰 검증 -->
    <g id="s5" onclick="showTip(4)" style="cursor:pointer">
      <rect x="476" y="376" width="168" height="46" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
      <text font-family="inherit" font-size="13" font-weight="500" fill="#712B13" x="560" y="393" text-anchor="middle" dominant-baseline="central">⑤ 토큰 검증</text>
      <text font-family="inherit" font-size="12" fill="#993C1D" x="560" y="411" text-anchor="middle" dominant-baseline="central">IAM ARN 확인</text>
    </g>

    <!-- aws-auth ConfigMap -->
    <rect x="476" y="430" width="168" height="32" rx="6" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
    <text font-family="inherit" font-size="12" fill="#712B13" x="560" y="446" text-anchor="middle" dominant-baseline="central">aws-auth ConfigMap</text>

    <!-- arrow: 검증 → ConfigMap -->
    <line x1="560" y1="422" x2="560" y2="430" stroke="#993C1D" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrow)"/>

    <!-- arrow: API Server → result back -->
    <line x1="460" y1="455" x2="380" y2="455" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- arrow: bearer → 결과 연결 -->
    <line x1="210" y1="412" x2="210" y2="440" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

    <!-- ⑥ 결과 반환 -->
    <g id="s6" onclick="showTip(5)" style="cursor:pointer">
      <rect x="40" y="440" width="340" height="58" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
      <text font-family="inherit" font-size="13" font-weight="500" fill="#085041" x="210" y="462" text-anchor="middle" dominant-baseline="central">⑥ 요청 허용 → 결과 반환</text>
      <text font-family="inherit" font-size="12" fill="#0F6E56" x="210" y="480" text-anchor="middle" dominant-baseline="central">Pod 목록, Node 정보 등 응답 수신</text>
    </g>

    <!-- 비교 박스 -->
    <rect x="40" y="516" width="340" height="62" rx="8" fill="#D3D1C7" stroke="#888780" stroke-width="0.5" fill-opacity="0.4"/>
    <text font-family="inherit" font-size="13" font-weight="500" fill="#2C2C2A" x="210" y="536" text-anchor="middle" dominant-baseline="central">aws-iam-authenticator vs aws eks get-token</text>
    <circle cx="76" cy="558" r="5" fill="#888780"/>
    <text font-family="inherit" font-size="12" fill="#5F5E5A" x="90" y="558" dominant-baseline="central">옛날 방식 (별도 바이너리 설치)</text>
    <circle cx="76" cy="572" r="5" fill="#1D9E75"/>
    <text font-family="inherit" font-size="12" fill="#5F5E5A" x="90" y="572" dominant-baseline="central">현재 권장 (AWS CLI 내장)</text>
  </svg>

  <div id="tip" class="tip-box">
    위의 박스를 클릭하면 해당 단계의 상세 설명이 여기에 표시됩니다.
  </div>

  <script>
    const tips = [
      `<strong>① kubectl get pods</strong> — 사용자가 명령을 실행하면 kubectl은 <span class="mono">~/.kube/config</span>를 읽습니다. 이 파일에 <span class="mono">users[].exec</span> 항목이 있으면 kubectl이 직접 토큰을 가져오는 게 아니라, 지정된 명령을 실행해서 토큰을 받아오도록 위임합니다. kubeconfig에 비밀번호가 저장되지 않는 이유입니다.`,
      `<strong>② aws eks get-token</strong> — kubectl이 자동으로 실행합니다. 이 명령은 로컬에 설정된 IAM 자격증명(<span class="mono">~/.aws/credentials</span>)을 사용해 AWS STS에 Presigned URL 형태의 요청을 만듭니다. 사용자가 직접 실행할 필요 없이 kubectl 요청마다 자동 호출됩니다.`,
      `<strong>③ AWS STS (임시 토큰 발급)</strong> — STS(Security Token Service)가 IAM 자격증명을 검증하고 Base64 인코딩된 임시 토큰을 발급합니다. 유효시간은 15분으로 짧아 탈취되더라도 피해가 제한됩니다. 쿠버네티스 자체 사용자 DB가 없고 AWS IAM이 인증 백엔드 역할을 하는 게 EKS 인증의 핵심입니다.`,
      `<strong>④ Authorization: Bearer &lt;token&gt;</strong> — kubectl이 받은 토큰을 HTTP 헤더에 담아 EKS API Server로 전송합니다. 모든 kubectl 요청(get/apply/delete 등)에 이 헤더가 자동으로 포함됩니다. Lens도 동일한 방식으로 이 헤더를 붙여서 API Server에 요청합니다.`,
      `<strong>⑤ EKS API Server 토큰 검증</strong> — API Server가 Bearer 토큰으로 STS GetCallerIdentity를 호출해 IAM ARN을 확인합니다. 그 다음 <span class="mono">aws-auth ConfigMap</span>에서 해당 IAM ARN이 어떤 K8s 사용자/그룹에 매핑되는지 조회합니다. RBAC 권한이 있으면 요청을 허용합니다.`,
      `<strong>⑥ 요청 허용 → 결과 반환</strong> — RBAC 검증까지 통과하면 API Server가 etcd에서 데이터를 조회해 kubectl에 응답합니다. kubectl get pods라면 Pod 목록이 터미널에 출력됩니다. endpoint_public_access=false이면 이 전체 흐름의 네트워크 연결 자체가 차단됩니다.`
    ];

    function showTip(i) {
      document.getElementById('tip').innerHTML = tips[i];
    }
  </script>
</body>
</html>
