<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pod → Pod 통신 흐름 (Service 경유)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8f8f6;
      color: #1a1a18;
      padding: 32px 20px;
      line-height: 1.6;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #6b6b66; margin-bottom: 24px; }

    .tab-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .step-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px;
      border: 1px solid #d3d1c7;
      border-radius: 6px;
      background: #fff;
      color: #6b6b66;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: all .18s;
    }
    .step-btn:hover { border-color: #888780; color: #1a1a18; }
    .step-btn.active {
      background: #e6f1fb;
      color: #185fa5;
      border-color: #85b7eb;
      font-weight: 500;
    }
    .step-dot {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #d3d1c7;
      color: #6b6b66;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 500;
      flex-shrink: 0;
    }
    .step-btn.active .step-dot { background: #185fa5; color: #fff; }

    svg { display: block; width: 100%; margin-bottom: 12px; }

    .desc-box {
      padding: 12px 16px;
      background: #f1efe8;
      border: 1px solid #d3d1c7;
      border-radius: 8px;
      font-size: 12px;
      color: #5f5e5a;
      line-height: 1.75;
      min-height: 60px;
    }
    .desc-box strong { color: #1a1a18; font-weight: 600; }
    .mono {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      background: #fff;
      border: 1px solid #d3d1c7;
      border-radius: 4px;
      padding: 1px 5px;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1c; color: #d4d2c8; }
      h1 { color: #d4d2c8; }
      .subtitle { color: #888780; }
      .step-btn { background: #2c2c2a; color: #888780; border-color: #444441; }
      .step-btn:hover { border-color: #888780; color: #d4d2c8; }
      .step-btn.active { background: #0c447c; color: #b5d4f4; border-color: #185fa5; }
      .step-dot { background: #444441; color: #888780; }
      .step-btn.active .step-dot { background: #185fa5; color: #fff; }
      .desc-box { background: #2c2c2a; border-color: #444441; color: #888780; }
      .desc-box strong { color: #d4d2c8; }
      .mono { background: #1e1e1c; border-color: #444441; color: #b5d4f4; }
    }
  </style>
</head>
<body>
  <h1>Pod → Pod 통신 흐름 (Service 경유)</h1>
  <p class="subtitle">각 탭을 클릭하면 해당 단계의 컴포넌트만 강조됩니다.</p>

  <div class="tab-bar">
    <button class="step-btn active" onclick="setStep(0,this)"><span class="step-dot">1</span>DNS 조회</button>
    <button class="step-btn" onclick="setStep(1,this)"><span class="step-dot">2</span>iptables DNAT</button>
    <button class="step-btn" onclick="setStep(2,this)"><span class="step-dot">3</span>VPC 라우팅</button>
    <button class="step-btn" onclick="setStep(3,this)"><span class="step-dot">4</span>NetworkPolicy</button>
    <button class="step-btn" onclick="setStep(4,this)"><span class="step-dot">?</span>왜 Service?</button>
  </div>

  <svg id="diagram" viewBox="0 0 680 370" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <!-- Node A (AZ-a) container -->
    <rect x="20" y="20" width="190" height="320" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text font-family="inherit" font-size="13" font-weight="500" fill="#3C3489" x="115" y="44" text-anchor="middle" dominant-baseline="central">Node A (AZ-a)</text>

    <!-- Pod-A -->
    <g id="podA" style="cursor:pointer">
      <rect x="38" y="60" width="154" height="54" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
      <text font-family="inherit" font-size="13" font-weight="500" fill="#0C447C" x="115" y="80" text-anchor="middle" dominant-baseline="central">Pod-A</text>
      <text font-family="inherit" font-size="12" fill="#185FA5" x="115" y="98" text-anchor="middle" dominant-baseline="central">10.0.10.11</text>
    </g>

    <!-- CoreDNS -->
    <g id="coredns" style="cursor:pointer">
      <rect x="38" y="136" width="154" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
      <text font-family="inherit" font-size="13" font-weight="500" fill="#085041" x="115" y="156" text-anchor="middle" dominant-baseline="central">CoreDNS Pod</text>
      <text font-family="inherit" font-size="12" fill="#0F6E56" x="115" y="174" text-anchor="middle" dominant-baseline="central">10.96.0.10</text>
    </g>

    <!-- iptables A -->
    <g id="iptables" style="cursor:pointer">
      <rect x="38" y="212" width="154" height="54" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
      <text font-family="inherit" font-size="13" font-weight="500" fill="#633806" x="115" y="232" text-anchor="middle" dominant-baseline="central">iptables (kube-proxy)</text>
      <text font-family="inherit" font-size="12" fill="#854F0B" x="115" y="250" text-anchor="middle" dominant-baseline="central">KUBE-SERVICES 체인</text>
    </g>

    <!-- NetworkPolicy A -->
    <g id="netpolA" style="cursor:pointer">
      <rect x="38" y="288" width="154" height="38" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
      <text font-family="inherit" font-size="12" font-weight="500" fill="#791F1F" x="115" y="307" text-anchor="middle" dominant-baseline="central">NetworkPolicy (egress)</text>
    </g>

    <!-- Service ClusterIP -->
    <g id="svc" style="cursor:pointer">
      <rect x="240" y="60" width="200" height="54" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
      <text font-family="inherit" font-size="13" font-weight="500" fill="#2C2C2A" x="340" y="80" text-anchor="middle" dominant-baseline="central">Service (ClusterIP)</text>
      <text font-family="inherit" font-size="12" fill="#5F5E5A" x="340" y="98" text-anchor="middle" dominant-baseline="central">my-svc  →  10.96.0.1 (가상)</text>
    </g>

    <!-- VPC Router -->
    <g id="vpc" style="cursor:pointer">
      <rect x="240" y="212" width="200" height="54" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
      <text font-family="inherit" font-size="13" font-weight="500" fill="#2C2C2A" x="340" y="232" text-anchor="middle" dominant-baseline="central">VPC Router</text>
      <text font-family="inherit" font-size="12" fill="#5F5E5A" x="340" y="250" text-anchor="middle" dominant-baseline="central">네이티브 라우팅 (캡슐화 없음)</text>
    </g>

    <!-- Node B (AZ-c) container -->
    <rect x="470" y="20" width="190" height="320" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text font-family="inherit" font-size="13" font-weight="500" fill="#3C3489" x="565" y="44" text-anchor="middle" dominant-baseline="central">Node B (AZ-c)</text>

    <!-- Pod-B -->
    <g id="podB" style="cursor:pointer">
      <rect x="488" y="60" width="154" height="54" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
      <text font-family="inherit" font-size="13" font-weight="500" fill="#0C447C" x="565" y="80" text-anchor="middle" dominant-baseline="central">Pod-B</text>
      <text font-family="inherit" font-size="12" fill="#185FA5" x="565" y="98" text-anchor="middle" dominant-baseline="central">10.0.11.8</text>
    </g>

    <!-- iptables B -->
    <g id="iptablesB" style="cursor:pointer">
      <rect x="488" y="212" width="154" height="54" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
      <text font-family="inherit" font-size="13" font-weight="500" fill="#633806" x="565" y="232" text-anchor="middle" dominant-baseline="central">iptables (Node B)</text>
      <text font-family="inherit" font-size="12" fill="#854F0B" x="565" y="250" text-anchor="middle" dominant-baseline="central">DNAT → Pod-B IP</text>
    </g>

    <!-- NetworkPolicy B -->
    <g id="netpolB" style="cursor:pointer">
      <rect x="488" y="288" width="154" height="38" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
      <text font-family="inherit" font-size="12" font-weight="500" fill="#791F1F" x="565" y="307" text-anchor="middle" dominant-baseline="central">NetworkPolicy (ingress)</text>
    </g>

    <!-- Arrows -->
    <line id="arr-dns" x1="115" y1="114" x2="115" y2="136" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.25"/>
    <path id="arr-resolve" d="M 192 163 L 240 87" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.25"/>
    <line id="arr-toipt" x1="115" y1="114" x2="115" y2="212" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)" opacity="0.25"/>
    <path id="arr-dnat" d="M 290 114 L 192 239" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.25"/>
    <line id="arr-ipt-vpc" x1="115" y1="266" x2="240" y2="239" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.25"/>
    <line id="arr-vpc-iptB" x1="440" y1="239" x2="488" y2="239" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.25"/>
    <line id="arr-iptB-podB" x1="565" y1="212" x2="565" y2="114" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.25"/>
    <line id="arr-netA" x1="115" y1="288" x2="115" y2="266" stroke="#A32D2D" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrow)" opacity="0.25"/>
    <line id="arr-netB" x1="565" y1="288" x2="565" y2="266" stroke="#A32D2D" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arrow)" opacity="0.25"/>
  </svg>

  <div id="desc" class="desc-box">
    <strong>1단계 — DNS 조회:</strong> Pod-A가 <span class="mono">my-svc.default.svc.cluster.local</span> 호출 →
    <span class="mono">/etc/resolv.conf</span>의 nameserver(CoreDNS 10.96.0.10)에 쿼리 →
    CoreDNS가 K8s API를 watch하며 관리하는 테이블에서 <span class="mono">my-svc → 10.96.0.1 (ClusterIP)</span> 반환.
    ClusterIP는 이 시점에 처음 알게 됩니다.
  </div>

  <script>
    const steps = [
      {
        desc: `<strong>1단계 — DNS 조회:</strong> Pod-A가 <span class="mono">my-svc.default.svc.cluster.local</span> 호출 → /etc/resolv.conf의 nameserver(CoreDNS 10.96.0.10)에 쿼리 → CoreDNS가 K8s API를 watch하며 관리하는 테이블에서 <span class="mono">my-svc → 10.96.0.1 (ClusterIP)</span> 반환. ClusterIP는 이 시점에 처음 알게 됩니다.`,
        bright: ['arr-dns','arr-resolve','podA','coredns','svc'],
        dim: ['arr-toipt','arr-dnat','arr-ipt-vpc','arr-vpc-iptB','arr-iptB-podB','arr-netA','arr-netB','iptables','iptablesB','vpc','podB','netpolA','netpolB']
      },
      {
        desc: `<strong>2단계 — iptables DNAT:</strong> Pod-A가 dst=10.96.0.1 패킷 전송 → Node A의 iptables KUBE-SERVICES 체인이 ClusterIP 매칭 → Endpoint 목록(실제 Pod IP들) 중 하나를 랜덤 선택해 DNAT 적용. <span class="mono">10.96.0.1 → 10.0.11.8 (Pod-B)</span>. 이 과정에서 로드밸런싱이 함께 수행되며, ClusterIP는 실제 인터페이스가 없는 가상 IP라 이 변환 없이는 도달 불가합니다.`,
        bright: ['arr-toipt','arr-dnat','arr-ipt-vpc','podA','iptables','svc','vpc'],
        dim: ['arr-dns','arr-resolve','arr-vpc-iptB','arr-iptB-podB','arr-netA','arr-netB','coredns','iptablesB','podB','netpolA','netpolB']
      },
      {
        desc: `<strong>3단계 — VPC 네이티브 라우팅:</strong> AWS VPC CNI 덕분에 Pod-B(10.0.11.8)는 실제 VPC IP를 보유. VPC Router가 이 IP를 그냥 EC2처럼 라우팅합니다. VXLAN 캡슐화 없음 → AZ-a Node A에서 AZ-c Node B로 직접 전달. Node B의 iptables가 수신 후 Pod-B로 최종 DNAT.`,
        bright: ['arr-ipt-vpc','arr-vpc-iptB','arr-iptB-podB','vpc','iptablesB','podB'],
        dim: ['arr-dns','arr-resolve','arr-toipt','arr-dnat','arr-netA','arr-netB','podA','coredns','svc','iptables','netpolA','netpolB']
      },
      {
        desc: `<strong>4단계 — NetworkPolicy 적용:</strong> egress(Pod-A 출발) 시점과 ingress(Pod-B 도착) 시점 두 곳에서 독립적으로 적용됩니다. iptables 또는 eBPF 기반. 실무 패턴은 <strong>default deny-all → 필요한 것만 allow</strong>. Policy가 없으면 모두 허용이므로 운영환경에서는 반드시 설정 필요.`,
        bright: ['arr-netA','arr-netB','netpolA','netpolB','podA','podB'],
        dim: ['arr-dns','arr-resolve','arr-toipt','arr-dnat','arr-ipt-vpc','arr-vpc-iptB','arr-iptB-podB','coredns','svc','iptables','iptablesB','vpc']
      },
      {
        desc: `<strong>왜 Service를 거쳐야 하나? (면접 핵심):</strong> ① Pod IP는 재시작 시 변경 → Service의 안정적 ClusterIP 필요. ② Pod IP 직접 호출 시 로드밸런싱 없음. ③ readiness probe 실패한 Pod도 직접 IP로는 접근 가능 → 장애 Pod로 트래픽 유입. Service는 healthy Endpoint만 유지해 이 문제를 모두 해결합니다.`,
        bright: ['podA','svc','iptables','vpc','iptablesB','podB','coredns','netpolA','netpolB','arr-dns','arr-resolve','arr-toipt','arr-dnat','arr-ipt-vpc','arr-vpc-iptB','arr-iptB-podB','arr-netA','arr-netB'],
        dim: []
      }
    ];

    function setStep(i, btn) {
      document.querySelectorAll('.step-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const s = steps[i];
      document.getElementById('desc').innerHTML = s.desc;
      s.bright.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.setAttribute('opacity', '1');
      });
      s.dim.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.setAttribute('opacity', '0.12');
      });
    }
  </script>
</body>
</html>
