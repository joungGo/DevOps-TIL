<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>K8s 네트워킹 구조</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8f8f6; color: #1a1a18; padding: 20px 16px; }
    h1 { font-size: 16px; font-weight: 600; margin-bottom: 14px; }
    .tb { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .tb button {
      padding: 6px 13px; border: 1px solid #d3d1c7; border-radius: 5px;
      background: #fff; color: #6b6b66; font-size: 12px; cursor: pointer;
      font-family: inherit; transition: all .15s;
    }
    .tb button:hover { border-color: #888780; color: #1a1a18; }
    .tb button.on { background: #e6f1fb; color: #185fa5; border-color: #85b7eb; font-weight: 500; }
    .panel { display: none; }
    .panel.on { display: block; }
    svg { display: block; width: 100%; }
    .nb { cursor: pointer; }
    .nb:hover > rect { opacity: 0.82; }
    .tip {
      margin-top: 10px; padding: 10px 14px;
      background: #f1efe8; border: 1px solid #d3d1c7;
      border-radius: 6px; font-size: 12px; color: #5f5e5a;
      line-height: 1.7; min-height: 44px;
    }
    .tip strong { color: #1a1a18; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1c; color: #d4d2c8; }
      h1 { color: #d4d2c8; }
      .tb button { background: #2c2c2a; color: #888780; border-color: #444441; }
      .tb button:hover { border-color: #888780; color: #d4d2c8; }
      .tb button.on { background: #0c447c; color: #b5d4f4; border-color: #185fa5; }
      .tip { background: #2c2c2a; border-color: #444441; color: #888780; }
      .tip strong { color: #d4d2c8; }
    }
  </style>
</head>
<body>
  <h1>K8s 네트워킹 구조</h1>

  <div class="tb">
    <button class="on" onclick="sw(0,this)">Service 타입</button>
    <button onclick="sw(1,this)">Namespace</button>
    <button onclick="sw(2,this)">CoreDNS</button>
    <button onclick="sw(3,this)">kube-proxy</button>
    <button onclick="sw(4,this)">VPC CNI</button>
    <button onclick="sw(5,this)">NetworkPolicy</button>
    <button onclick="sw(6,this)">Addon 전체</button>
  </div>

  <!-- ── Panel 0: Service 타입 ── -->
  <div class="panel on" id="p0">
  <svg viewBox="0 0 680 310" xmlns="http://www.w3.org/2000/svg">
    <defs><marker id="a0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
    <g class="nb" onclick="tt('ClusterIP (기본값)','클러스터 내부에서만 접근 가능한 가상 IP. 실제 인터페이스 없음. kube-proxy iptables가 ClusterIP → Pod IP로 DNAT. Pod 간 통신의 표준 방법. DNS: my-svc.namespace.svc.cluster.local')">
      <rect x="10" y="8" width="152" height="290" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
      <text font-family="inherit" font-size="11" font-weight="500" fill="#0C447C" x="86" y="26" text-anchor="middle" dominant-baseline="central">ClusterIP</text>
      <text font-family="inherit" font-size="9" fill="#185FA5" x="86" y="42" text-anchor="middle" dominant-baseline="central">클러스터 내부 전용</text>
      <rect x="24" y="58" width="124" height="26" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.3"/>
      <text font-family="inherit" font-size="9" fill="#0C447C" x="86" y="71" text-anchor="middle" dominant-baseline="central">Pod-A (10.0.10.11)</text>
      <rect x="24" y="92" width="124" height="26" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.3"/>
      <text font-family="inherit" font-size="9" fill="#0C447C" x="86" y="105" text-anchor="middle" dominant-baseline="central">Pod-B (10.0.11.8)</text>
      <rect x="24" y="134" width="124" height="30" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
      <text font-family="inherit" font-size="9" fill="#0C447C" x="86" y="146" text-anchor="middle" dominant-baseline="central">ClusterIP</text>
      <text font-family="inherit" font-size="9" fill="#185FA5" x="86" y="158" text-anchor="middle" dominant-baseline="central">10.96.0.1 (가상)</text>
      <line x1="86" y1="84" x2="86" y2="134" stroke="#185FA5" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#a0)"/>
      <text font-family="inherit" font-size="9" fill="#185FA5" x="86" y="190" text-anchor="middle" dominant-baseline="central">외부 접근 불가</text>
      <text font-family="inherit" font-size="9" fill="#185FA5" x="86" y="206" text-anchor="middle" dominant-baseline="central">Pod 간 통신 표준</text>
      <text font-family="inherit" font-size="9" fill="#185FA5" x="86" y="222" text-anchor="middle" dominant-baseline="central">로드밸런싱 포함</text>
      <text font-family="inherit" font-size="9" fill="#185FA5" x="86" y="238" text-anchor="middle" dominant-baseline="central">DNS 이름 제공</text>
    </g>
    <g class="nb" onclick="tt('NodePort','모든 Node의 특정 포트(30000-32767)를 열어서 외부 접근 허용. ClusterIP를 포함(NodePort = ClusterIP + 포트 개방). externalTrafficPolicy=Local이면 원본 IP 보존.')">
      <rect x="176" y="8" width="152" height="290" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
      <text font-family="inherit" font-size="11" font-weight="500" fill="#27500A" x="252" y="26" text-anchor="middle" dominant-baseline="central">NodePort</text>
      <text font-family="inherit" font-size="9" fill="#3B6D11" x="252" y="42" text-anchor="middle" dominant-baseline="central">Node IP + 포트로 접근</text>
      <rect x="190" y="58" width="124" height="26" rx="4" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.3"/>
      <text font-family="inherit" font-size="9" fill="#27500A" x="252" y="71" text-anchor="middle" dominant-baseline="central">외부 클라이언트</text>
      <line x1="252" y1="84" x2="252" y2="100" stroke="#3B6D11" stroke-width="1" marker-end="url(#a0)"/>
      <rect x="190" y="100" width="124" height="30" rx="5" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
      <text font-family="inherit" font-size="9" fill="#27500A" x="252" y="112" text-anchor="middle" dominant-baseline="central">Node IP:30080</text>
      <text font-family="inherit" font-size="9" fill="#3B6D11" x="252" y="124" text-anchor="middle" dominant-baseline="central">포트 범위: 30000-32767</text>
      <line x1="252" y1="130" x2="252" y2="146" stroke="#3B6D11" stroke-width="1" marker-end="url(#a0)"/>
      <rect x="190" y="146" width="124" height="26" rx="4" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.3"/>
      <text font-family="inherit" font-size="9" fill="#27500A" x="252" y="159" text-anchor="middle" dominant-baseline="central">ClusterIP (내부 포함)</text>
      <line x1="252" y1="172" x2="252" y2="188" stroke="#3B6D11" stroke-width="1" marker-end="url(#a0)"/>
      <rect x="190" y="188" width="124" height="26" rx="4" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.3"/>
      <text font-family="inherit" font-size="9" fill="#27500A" x="252" y="201" text-anchor="middle" dominant-baseline="central">Pod</text>
      <text font-family="inherit" font-size="9" fill="#3B6D11" x="252" y="238" text-anchor="middle" dominant-baseline="central">LoadBalancer 없어도 됨</text>
      <text font-family="inherit" font-size="9" fill="#3B6D11" x="252" y="254" text-anchor="middle" dominant-baseline="central">테스트/개발 환경 적합</text>
    </g>
    <g class="nb" onclick="tt('LoadBalancer','클라우드 LB(ALB/NLB)를 자동 생성. NodePort + ClusterIP를 모두 포함. EKS에서는 aws-load-balancer-controller가 ALB/NLB 자동 생성. Service type=LoadBalancer → NLB, Ingress → ALB.')">
      <rect x="342" y="8" width="152" height="290" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
      <text font-family="inherit" font-size="11" font-weight="500" fill="#633806" x="418" y="26" text-anchor="middle" dominant-baseline="central">LoadBalancer</text>
      <text font-family="inherit" font-size="9" fill="#854F0B" x="418" y="42" text-anchor="middle" dominant-baseline="central">클라우드 LB 자동 생성</text>
      <rect x="356" y="58" width="124" height="26" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="0.3"/>
      <text font-family="inherit" font-size="9" fill="#633806" x="418" y="71" text-anchor="middle" dominant-baseline="central">외부 클라이언트</text>
      <line x1="418" y1="84" x2="418" y2="100" stroke="#854F0B" stroke-width="1" marker-end="url(#a0)"/>
      <rect x="356" y="100" width="124" height="26" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
      <text font-family="inherit" font-size="9" fill="#633806" x="418" y="113" text-anchor="middle" dominant-baseline="central">ALB / NLB</text>
      <line x1="418" y1="126" x2="418" y2="142" stroke="#854F0B" stroke-width="1" marker-end="url(#a0)"/>
      <rect x="356" y="142" width="124" height="26" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="0.3"/>
      <text font-family="inherit" font-size="9" fill="#633806" x="418" y="155" text-anchor="middle" dominant-baseline="central">NodePort</text>
      <line x1="418" y1="168" x2="418" y2="184" stroke="#854F0B" stroke-width="1" marker-end="url(#a0)"/>
      <rect x="356" y="184" width="124" height="26" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="0.3"/>
      <text font-family="inherit" font-size="9" fill="#633806" x="418" y="197" text-anchor="middle" dominant-baseline="central">ClusterIP</text>
      <line x1="418" y1="210" x2="418" y2="226" stroke="#854F0B" stroke-width="1" marker-end="url(#a0)"/>
      <rect x="356" y="226" width="124" height="26" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="0.3"/>
      <text font-family="inherit" font-size="9" fill="#633806" x="418" y="239" text-anchor="middle" dominant-baseline="central">Pod</text>
      <text font-family="inherit" font-size="9" fill="#854F0B" x="418" y="275" text-anchor="middle" dominant-baseline="central">EKS 실무 표준</text>
    </g>
    <g class="nb" onclick="tt('ExternalName &amp; Headless','ExternalName: 외부 DNS 이름을 K8s Service 이름으로 매핑. 외부 DB를 클러스터 내부 이름으로 접근할 때 사용. Headless(ClusterIP=None): LB 없이 Pod IP 직접 반환. StatefulSet DB 클러스터 내부 통신에 사용.')">
      <rect x="508" y="8" width="164" height="290" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
      <text font-family="inherit" font-size="11" font-weight="500" fill="#3C3489" x="590" y="26" text-anchor="middle" dominant-baseline="central">ExternalName / Headless</text>
      <rect x="522" y="52" width="136" height="100" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.3"/>
      <text font-family="inherit" font-size="10" font-weight="500" fill="#3C3489" x="590" y="70" text-anchor="middle" dominant-baseline="central">ExternalName</text>
      <text font-family="inherit" font-size="9" fill="#534AB7" x="590" y="88" text-anchor="middle" dominant-baseline="central">my-db.svc →</text>
      <text font-family="inherit" font-size="9" fill="#534AB7" x="590" y="104" text-anchor="middle" dominant-baseline="central">rds.amazonaws.com</text>
      <text font-family="inherit" font-size="9" fill="#534AB7" x="590" y="120" text-anchor="middle" dominant-baseline="central">외부 DNS 이름 매핑</text>
      <text font-family="inherit" font-size="9" fill="#534AB7" x="590" y="136" text-anchor="middle" dominant-baseline="central">ClusterIP 없음</text>
      <rect x="522" y="168" width="136" height="100" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.3"/>
      <text font-family="inherit" font-size="10" font-weight="500" fill="#3C3489" x="590" y="186" text-anchor="middle" dominant-baseline="central">Headless</text>
      <text font-family="inherit" font-size="9" fill="#534AB7" x="590" y="204" text-anchor="middle" dominant-baseline="central">clusterIP: None</text>
      <text font-family="inherit" font-size="9" fill="#534AB7" x="590" y="220" text-anchor="middle" dominant-baseline="central">Pod IP 직접 반환</text>
      <text font-family="inherit" font-size="9" fill="#534AB7" x="590" y="236" text-anchor="middle" dominant-baseline="central">StatefulSet DB용</text>
      <text font-family="inherit" font-size="9" fill="#534AB7" x="590" y="252" text-anchor="middle" dominant-baseline="central">LB 없음</text>
    </g>
  </svg>
  </div>

  <!-- ── Panel 1: Namespace ── -->
  <div class="panel" id="p1">
  <svg viewBox="0 0 680 310" xmlns="http://www.w3.org/2000/svg">
    <g class="nb" onclick="tt('kube-system Namespace','K8s 시스템 컴포넌트가 위치. coredns, kube-proxy, aws-node(VPC CNI), metrics-server 등. 함부로 수정하면 클러스터 전체에 영향. 일반 앱 배포 금지.')">
      <rect x="10" y="8" width="196" height="290" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
      <text font-family="inherit" font-size="11" font-weight="500" fill="#712B13" x="108" y="26" text-anchor="middle" dominant-baseline="central">kube-system</text>
      <text font-family="inherit" font-size="9" fill="#993C1D" x="108" y="42" text-anchor="middle" dominant-baseline="central">K8s 시스템 컴포넌트</text>
      <rect x="24" y="56" width="168" height="26" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.3"/>
      <text font-family="inherit" font-size="9" fill="#712B13" x="108" y="69" text-anchor="middle" dominant-baseline="central">coredns Pod</text>
      <rect x="24" y="88" width="168" height="26" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.3"/>
      <text font-family="inherit" font-size="9" fill="#712B13" x="108" y="101" text-anchor="middle" dominant-baseline="central">kube-proxy Pod (각 Node당)</text>
      <rect x="24" y="120" width="168" height="26" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.3"/>
      <text font-family="inherit" font-size="9" fill="#712B13" x="108" y="133" text-anchor="middle" dominant-baseline="central">aws-node Pod (VPC CNI)</text>
      <rect x="24" y="152" width="168" height="26" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.3"/>
      <text font-family="inherit" font-size="9" fill="#712B13" x="108" y="165" text-anchor="middle" dominant-baseline="central">metrics-server Pod</text>
      <rect x="24" y="184" width="168" height="26" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.3"/>
      <text font-family="inherit" font-size="9" fill="#712B13" x="108" y="197" text-anchor="middle" dominant-baseline="central">aws-load-balancer-controller</text>
      <text font-family="inherit" font-size="9" fill="#993C1D" x="108" y="236" text-anchor="middle" dominant-baseline="central">수정 금지 영역</text>
      <text font-family="inherit" font-size="9" fill="#993C1D" x="108" y="252" text-anchor="middle" dominant-baseline="central">앱 배포 금지</text>
    </g>
    <g class="nb" onclick="tt('default Namespace','Namespace를 지정하지 않으면 기본 배포 위치. 테스트 목적으로는 OK. 운영 환경에서는 앱별 별도 Namespace 권장. ResourceQuota, LimitRange로 리소스 제한 가능.')">
      <rect x="218" y="8" width="140" height="290" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
      <text font-family="inherit" font-size="11" font-weight="500" fill="#085041" x="288" y="26" text-anchor="middle" dominant-baseline="central">default</text>
      <text font-family="inherit" font-size="9" fill="#0F6E56" x="288" y="42" text-anchor="middle" dominant-baseline="central">기본 Namespace</text>
      <rect x="232" y="56" width="112" height="26" rx="4" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.3"/>
      <text font-family="inherit" font-size="9" fill="#085041" x="288" y="69" text-anchor="middle" dominant-baseline="central">url-shortener Pod</text>
      <rect x="232" y="88" width="112" height="26" rx="4" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.3"/>
      <text font-family="inherit" font-size="9" fill="#085041" x="288" y="101" text-anchor="middle" dominant-baseline="central">Service</text>
      <text font-family="inherit" font-size="9" fill="#0F6E56" x="288" y="152" text-anchor="middle" dominant-baseline="central">Namespace 미지정 시</text>
      <text font-family="inherit" font-size="9" fill="#0F6E56" x="288" y="168" text-anchor="middle" dominant-baseline="central">기본 위치</text>
      <text font-family="inherit" font-size="9" fill="#0F6E56" x="288" y="200" text-anchor="middle" dominant-baseline="central">운영에선 비권장</text>
    </g>
    <g class="nb" onclick="tt('커스텀 Namespace','앱/팀/환경별로 논리적 격리. 같은 Namespace 내 Service DNS: my-svc. 다른 Namespace: my-svc.other-ns.svc.cluster.local. RBAC으로 Namespace별 접근 제어. ResourceQuota로 CPU/메모리 제한.')">
      <rect x="370" y="8" width="300" height="290" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
      <text font-family="inherit" font-size="11" font-weight="500" fill="#3C3489" x="520" y="26" text-anchor="middle" dominant-baseline="central">커스텀 Namespace</text>
      <text font-family="inherit" font-size="9" fill="#534AB7" x="520" y="42" text-anchor="middle" dominant-baseline="central">앱 / 팀 / 환경별 격리</text>
      <rect x="384" y="56" width="124" height="100" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.3"/>
      <text font-family="inherit" font-size="10" font-weight="500" fill="#3C3489" x="446" y="74" text-anchor="middle" dominant-baseline="central">production</text>
      <rect x="396" y="88" width="100" height="22" rx="3" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.3"/>
      <text font-family="inherit" font-size="9" fill="#26215C" x="446" y="99" text-anchor="middle" dominant-baseline="central">api Pod</text>
      <rect x="396" y="116" width="100" height="22" rx="3" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.3"/>
      <text font-family="inherit" font-size="9" fill="#26215C" x="446" y="127" text-anchor="middle" dominant-baseline="central">frontend Pod</text>
      <rect x="524" y="56" width="132" height="100" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.3"/>
      <text font-family="inherit" font-size="10" font-weight="500" fill="#3C3489" x="590" y="74" text-anchor="middle" dominant-baseline="central">monitoring</text>
      <rect x="536" y="88" width="108" height="22" rx="3" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.3"/>
      <text font-family="inherit" font-size="9" fill="#26215C" x="590" y="99" text-anchor="middle" dominant-baseline="central">prometheus Pod</text>
      <rect x="536" y="116" width="108" height="22" rx="3" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.3"/>
      <text font-family="inherit" font-size="9" fill="#26215C" x="590" y="127" text-anchor="middle" dominant-baseline="central">grafana Pod</text>
      <text font-family="inherit" font-size="9" fill="#534AB7" x="520" y="180" text-anchor="middle" dominant-baseline="central">같은 NS: my-svc</text>
      <text font-family="inherit" font-size="9" fill="#534AB7" x="520" y="196" text-anchor="middle" dominant-baseline="central">다른 NS: my-svc.ns.svc.cluster.local</text>
      <text font-family="inherit" font-size="9" fill="#534AB7" x="520" y="220" text-anchor="middle" dominant-baseline="central">RBAC 접근 제어</text>
      <text font-family="inherit" font-size="9" fill="#534AB7" x="520" y="236" text-anchor="middle" dominant-baseline="central">ResourceQuota 리소스 제한</text>
      <text font-family="inherit" font-size="9" fill="#534AB7" x="520" y="252" text-anchor="middle" dominant-baseline="central">NetworkPolicy 트래픽 격리</text>
    </g>
  </svg>
  </div>

  <!-- ── Panel 2: CoreDNS ── -->
  <div class="panel" id="p2">
  <svg viewBox="0 0 680 310" xmlns="http://www.w3.org/2000/svg">
    <defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

      <text font-family="inherit" font-size="9" fill="#3B6D11" x="256" y="138" text-anchor="middle" dominant-baseline="central">K8s API watching</text>

      <text font-family="inherit" font-size="9" fill="#3B6D11" x="256" y="186" text-anchor="middle" dominant-baseline="central">없는 이름이면</text>
      <text font-family="inherit" font-size="9" fill="#3B6D11" x="256" y="202" text-anchor="middle" dominant-baseline="central">AWS Route53으로 포워딩</text>

      <text font-family="inherit" font-size="9" fill="#3C3489" x="599" y="198" text-anchor="middle" dominant-baseline="central">다른 NS:</text>
      <text font-family="inherit" font-size="9" fill="#534AB7" x="599" y="214" text-anchor="middle" dominant-baseline="central">my-svc.other-ns</text>
      <text font-family="inherit" font-size="9" fill="#3C3489" x="599" y="246" text-anchor="middle" dominant-baseline="central">외부:</text>

  <!-- ── Panel 3: kube-proxy ── -->
  <div class="panel" id="p3">
  <svg viewBox="0 0 680 310" xmlns="http://www.w3.org/2000/svg">

      <text font-family="inherit" font-size="10" font-weight="500" fill="#712B13" x="110" y="26" text-anchor="middle" dominant-baseline="central">kube-proxy 역할</text>
      <rect x="24" y="44" width="172" height="26" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.3"/>

      <line x1="294" y1="140" x2="270" y2="156" stroke="#3B6D11" stroke-width="1" marker-end="url(#a3)"/>

    <g class="nb" onclick="tt('iptables vs IPVS 모드','iptables(기본): 규칙 수가 Service×Pod 수만큼 증가. Service 수천 개면 규칙 수만 개 → 성능 저하. IPVS(고성능): Linux 커널 레벨 L4 LB. 해시 테이블 기반으로 Service 수에 무관하게 O(1) 조회. 대규모 클러스터에서 IPVS 권장. RR, LC, WRR 등 다양한 알고리즘 지원.')">

      <text font-family="inherit" font-size="9" fill="#534AB7" x="511" y="144" text-anchor="middle" dominant-baseline="central">O(N) 탐색</text>
      <rect x="572" y="44" width="86" height="130" rx="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.3"/>
      <text font-family="inherit" font-size="10" font-weight="500" fill="#3C3489" x="615" y="62" text-anchor="middle" dominant-baseline="central">IPVS</text>

  <!-- ── Panel 4: VPC CNI ── -->

    <g class="nb" onclick="tt('aws-node (VPC CNI)','각 Node DaemonSet으로 실행. ENI를 Node에 추가로 붙이고 Secondary IP를 Pod에 할당. Pod가 실제 VPC IP 보유 → 오버레이 없이 VPC 라우팅으로 직접 통신. NodeGroup IAM Role에 EKS_CNI_Policy 필수.')">
